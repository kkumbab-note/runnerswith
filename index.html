    <script>
      // 첫 화면을 그리기 전에 맞춰요: 스크립트 사용 표시(등장 효과용), 저장된 모션 설정
      ;(function () {
        var root = document.documentElement
        root.classList.add("js")
        // 앱 스크립트를 끝내 못 받으면 등장 효과로 숨겨 둔 내용을 그냥 보여줘요
        setTimeout(function () {
          if (!window.__rwReady) root.classList.remove("js")
        }, 6000)
        // 주문 폼은 스크립트로만 처리해요. 폼 코드가 도착하기 전에 눌러도 페이지가 새로고침되지 않게 막아요
        document.addEventListener("submit", function (e) {
          if (e.target.hasAttribute && e.target.hasAttribute("data-js-form")) e.preventDefault()
        })
        try {
          var motion = localStorage.getItem("rw-motion")
          if (motion === "paused") root.classList.add("motion-paused")
          else if (motion === "play") root.classList.add("motion-play")
        } catch (e) {}
      })()
    </script>
